[project]
name = "codecrafters-kafka"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "loguru==0.7.3",
]

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "kafka-python>=2.3.1",
    "locust>=2.44.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
]
